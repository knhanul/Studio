<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>편집실</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <script>
    (function(){
      try {
        var key = 'compose-theme';
        var syncKey = 'compose-theme-system-sync';
        var stored = localStorage.getItem(key);
        var sync = localStorage.getItem(syncKey) === '1';
        var theme = 'light-blue';
        if (sync) {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light-blue';
        } else if (stored && ['light-blue','warm-cream','silver-light','dark'].indexOf(stored) !== -1) {
          theme = stored;
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
      } catch(e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
